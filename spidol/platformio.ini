; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; main-touch.cpp is an old duplicate of main.cpp (same setup()/loop()/
; connectToServer() at file scope) -- excluded here rather than deleted,
; since compiling both together fails to link regardless of per-file fixes.
build_src_filter = +<*> -<main-touch.cpp>
; Lower than the 921600 default -- some DevKit clones' USB-serial chips
; and/or auto-reset circuitry are unreliable at the higher speed, causing
; "Wrong boot mode detected" upload failures.
upload_speed = 115200
; Must match Serial.begin(115200) in main.cpp -- PlatformIO's own monitor
; default is 9600, not 115200, so without this the monitor and the chip
; disagree on bit rate and every line prints as garbled/random characters.
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
