[project]
name = "spidol-server"
version = "0.1.0"
description = "SPIDOL core vision & AI engine (WebSocket server + HAL)"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "opencv-python>=4.8.0",
    "google-genai>=0.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
